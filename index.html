<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AR Murales MultiTarget</title>

  <!-- AFRAME -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>

  <!-- MINDAR -->
  <script src="https://unpkg.com/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
      font-family: Arial, sans-serif;
    }

    #debug {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      color: #00ffcc;
      padding: 10px 18px;
      border-radius: 12px;
      z-index: 999;
      font-size: 14px;
      backdrop-filter: blur(6px);
    }

    #msg {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.65);
      color: white;
      padding: 12px 20px;
      border-radius: 20px;
      z-index: 999;
      font-size: 15px;
      backdrop-filter: blur(6px);
    }

    #startBtn {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 18px 28px;
      background: #00ffcc;
      color: black;
      border: none;
      font-size: 18px;
      font-weight: bold;
      border-radius: 14px;
      z-index: 1000;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(0, 255, 204, 0.5);
    }
  </style>
</head>

<body>

  <button id="startBtn">
    Iniciar experiencia
  </button>

  <div id="debug">
    Estado: iniciando...
  </div>

  <div id="msg">
    📷 Apunta al mural
  </div>

  <!-- ===================================================== -->
  <!-- SCENE -->
  <!-- ===================================================== -->

  <a-scene
    id="scene"
    mindar-image="
      imageTargetSrc: ./assets/targets.mind;
      autoStart: false;
      uiLoading: yes;
      uiScanning: yes;
      maxTrack: 4;
    "
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >

    <!-- ASSETS -->
    <a-assets id="assets"></a-assets>

    <!-- CAMERA -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>

    <!-- ===================================================== -->
    <!-- TARGET 0 -->
    <!-- ===================================================== -->

    <a-entity
      mindar-image-target="targetIndex: 0"
      id="target0"
    >
      <a-entity id="root0" visible="false"></a-entity>
    </a-entity>

    <!-- ===================================================== -->
    <!-- TARGET 1 -->
    <!-- ===================================================== -->

    <a-entity
      mindar-image-target="targetIndex: 1"
      id="target1"
    >
      <a-entity id="root1" visible="false"></a-entity>
    </a-entity>

    <!-- ===================================================== -->
    <!-- TARGET 2 -->
    <!-- ===================================================== -->

    <a-entity
      mindar-image-target="targetIndex: 2"
      id="target2"
    >
      <a-entity id="root2" visible="false"></a-entity>
    </a-entity>

    <!-- ===================================================== -->
    <!-- TARGET 3 -->
    <!-- ===================================================== -->

    <a-entity
      mindar-image-target="targetIndex: 3"
      id="target3"
    >
      <a-entity id="root3" visible="false"></a-entity>
    </a-entity>

  </a-scene>

  <script>

    // =========================================================
    // REFERENCIAS
    // =========================================================

    const debug = document.getElementById("debug");
    const startBtn = document.getElementById("startBtn");
    const sceneEl = document.getElementById("scene");
    const assets = document.getElementById("assets");

    // =========================================================
    // TARGETS
    // =========================================================

    const targets = [
      {
        target: document.getElementById("target0"),
        root: document.getElementById("root0"),
        escena: "escena0.json",
        nombre: "Mural 0"
      },
      {
        target: document.getElementById("target1"),
        root: document.getElementById("root1"),
        escena: "escena1.json",
        nombre: "Mural 1"
      },
      {
        target: document.getElementById("target2"),
        root: document.getElementById("root2"),
        escena: "escena2.json",
        nombre: "Mural 2"
      },
      {
        target: document.getElementById("target3"),
        root: document.getElementById("root3"),
        escena: "escena3.json",
        nombre: "Mural 3"
      }
    ];

    // =========================================================
    // CACHE ASSETS
    // =========================================================

    const loadedAssets = new Set();

    // =========================================================
    // CARGAR ESCENA
    // =========================================================

    async function cargarEscena(jsonFile, root) {

      try {

        debug.innerText = `📦 Cargando ${jsonFile}`;

        const res = await fetch(jsonFile);
        const data = await res.json();

        for (const el of data.elementos) {

          const uniqueId =
            "asset_" +
            (el.asset || el.prefix || Math.random())
              .replace(/\W/g, "_");

          const isVideo =
            el.asset &&
            el.asset.match(/\.(mp4|webm)$/i);

          let obj;

          // =====================================================
          // PNG SEQUENCE
          // =====================================================

          if (el.type === "png_sequence") {

            const totalFrames = el.frames;
            const prefix = el.prefix;

            let currentFrame = 1;

            obj = document.createElement("a-image");

            obj.setAttribute("width", el.width || 1);
            obj.setAttribute("height", el.height || 1);

            function getFrame(frame) {

              return `assets/${prefix}${String(frame).padStart(4, "0")}.png`;

            }

            obj.setAttribute("src", getFrame(1));

            const fps = el.fps || 24;
            const interval = 1000 / fps;

            let lastTime = 0;

            function animate(time) {

              if (time - lastTime >= interval) {

                currentFrame++;

                if (currentFrame > totalFrames) {
                  currentFrame = 1;
                }

                obj.setAttribute(
                  "src",
                  getFrame(currentFrame)
                );

                lastTime = time;
              }

              requestAnimationFrame(animate);
            }

            requestAnimationFrame(animate);
          }

          // =====================================================
          // VIDEO
          // =====================================================

          else if (isVideo) {

            if (!loadedAssets.has(uniqueId)) {

              const video = document.createElement("video");

              video.src = "assets/" + el.asset;
              video.id = uniqueId;
              video.loop = true;
              video.muted = true;
              video.playsInline = true;
              video.crossOrigin = "anonymous";
              video.preload = "auto";

              assets.appendChild(video);

              loadedAssets.add(uniqueId);
            }

            obj = document.createElement("a-video");

            obj.setAttribute("src", "#" + uniqueId);

            obj.setAttribute(
              "width",
              el.width || 1
            );

            obj.setAttribute(
              "height",
              el.height || 0.6
            );
          }

          // =====================================================
          // IMAGEN
          // =====================================================

          else {

            if (!loadedAssets.has(uniqueId)) {

              const img = document.createElement("img");

              img.src = "assets/" + el.asset;
              img.id = uniqueId;

              assets.appendChild(img);

              loadedAssets.add(uniqueId);
            }

            obj = document.createElement("a-image");

            obj.setAttribute(
              "src",
              "#" + uniqueId
            );

            obj.setAttribute(
              "width",
              el.width || 1
            );

            obj.setAttribute(
              "height",
              el.height || 1
            );
          }

          // =====================================================
          // TRANSFORMACIONES
          // =====================================================

          obj.setAttribute(
            "position",
            `
            ${el.position?.x || 0}
            ${el.position?.y || 0}
            ${el.position?.z || 0}
            `
          );

          obj.setAttribute(
            "rotation",
            `
            ${el.rotation?.x || 0}
            ${el.rotation?.y || 0}
            ${el.rotation?.z || 0}
            `
          );

          obj.setAttribute(
            "scale",
            `
            ${el.scale?.x || 1}
            ${el.scale?.y || 1}
            ${el.scale?.z || 1}
            `
          );

          // =====================================================
          // TRANSPARENCIA
          // =====================================================

          obj.setAttribute(
            "material",
            "transparent: true; alphaTest: 0.01;"
          );

          // =====================================================
          // AGREGAR AL ROOT
          // =====================================================

          root.appendChild(obj);
        }

      } catch (err) {

        console.error(err);

        debug.innerText =
          `💥 Error cargando ${jsonFile}`;
      }
    }

    // =========================================================
    // CONFIGURAR TARGETS
    // =========================================================

    async function inicializarTargets() {

      for (let i = 0; i < targets.length; i++) {

        const t = targets[i];

        // =====================================================
        // CARGAR ESCENA
        // =====================================================

        await cargarEscena(
          t.escena,
          t.root
        );

        // =====================================================
        // TARGET FOUND
        // =====================================================

        t.target.addEventListener(
          "targetFound",
          () => {

            debug.innerText =
              `✅ Detectado ${t.nombre}`;

            t.root.setAttribute(
              "visible",
              true
            );

            // PLAY VIDEOS

            document
              .querySelectorAll("video")
              .forEach(v => {

                v.play()
                  .catch(() => { });

              });

          }
        );

        // =====================================================
        // TARGET LOST
        // =====================================================

        t.target.addEventListener(
          "targetLost",
          () => {

            debug.innerText =
              `❌ Perdido ${t.nombre}`;

            t.root.setAttribute(
              "visible",
              false
            );

          }
        );
      }

      debug.innerText = "🎯 Targets listos";
    }

    // =========================================================
    // START EXPERIENCE
    // =========================================================

    startBtn.addEventListener(
      "click",
      async () => {

        try {

          startBtn.style.display = "none";

          debug.innerText =
            "🚀 Iniciando cámara...";

          // ===========================================
          // CARGAR TARGETS
          // ===========================================

          await inicializarTargets();

          // ===========================================
          // START MINDAR
          // ===========================================

          const mindarSystem =
            sceneEl.systems["mindar-image-system"];

          await mindarSystem.start();

          // ===========================================
          // AUTOPLAY VIDEOS
          // ===========================================

          document
            .querySelectorAll("video")
            .forEach(v => {

              v.play()
                .catch(() => { });

            });

          debug.innerText =
            "📷 Escaneando murales";

        } catch (err) {

          console.error(err);

          debug.innerText =
            "💥 Error iniciando";

        }
      }
    );

  </script>

</body>

</html>
