<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AR Libreta</title>

  <!-- AFRAME -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>

  <!-- MINDAR -->
  <script src="./libs/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #videoFeed {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 1;
      display: none;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 10 !important;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
    }

    #debug {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      color: #00ffcc;
      padding: 10px 18px;
      border-radius: 12px;
      z-index: 10001;
      font-size: 14px;
      backdrop-filter: blur(6px);
      font-weight: bold;
      pointer-events: none;
    }

    #msg {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      color: white;
      padding: 12px 20px;
      border-radius: 20px;
      z-index: 10001;
      font-size: 15px;
      backdrop-filter: blur(6px);
      pointer-events: none;
    }

    #startBtn {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 18px 28px;
      background: #00ffcc;
      color: black;
      border: none;
      font-size: 18px;
      font-weight: bold;
      border-radius: 14px;
      z-index: 10000;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(0, 255, 204, 0.5);
    }
  </style>
</head>

<body>

  <!-- FEED -->
  <video
    id="videoFeed"
    autoplay
    muted
    playsinline
  ></video>

  <button id="startBtn">
    Iniciar experiencia
  </button>

  <div id="debug">
    Estado: iniciando...
  </div>

  <div id="msg">
    📷 Apunta a la libreta
  </div>

  <!-- ===================================================== -->
  <!-- SCENE -->
  <!-- ===================================================== -->

  <a-scene
    id="scene"
    mindar-image="
      imageTargetSrc: ./assets/libreta.mind;
      autoStart: false;
      uiLoading: yes;
      uiScanning: yes;
      maxTrack: 1;
    "
    color-space="sRGB"
    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      antialias: true;
      alpha: true;
    "
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
  >

    <a-assets id="assets"></a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
      wasd-controls="enabled: false"
    ></a-camera>

    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0"
    >
      <a-entity
        id="root"
        visible="false"
      ></a-entity>
    </a-entity>

  </a-scene>

  <script>

    const debug = document.getElementById("debug");
    const startBtn = document.getElementById("startBtn");
    const videoFeed = document.getElementById("videoFeed");

    const sceneEl = document.getElementById("scene");
    const assets = document.getElementById("assets");

    const target = document.getElementById("target");
    const root = document.getElementById("root");

    let videoElement = null;
    let mediaStream = null;
    let sequenceAnimationId = null;

    // =====================================================
    // DETECTAR IOS
    // =====================================================

    function esIOS() {

      return /iphone|ipad|ipod/i.test(
        navigator.userAgent
      );
    }

    const isIOS = esIOS();

    console.log(
      "📱 iOS:",
      isIOS
    );

    // =====================================================
    // CÁMARA
    // =====================================================

    async function iniciarCamara() {

      mediaStream =
        await navigator.mediaDevices.getUserMedia({

          video: {
            facingMode: "environment",
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },

          audio: false
        });

      videoFeed.srcObject = mediaStream;

      videoFeed.style.display = "block";
    }

    // =====================================================
    // PNG SEQUENCE
    // =====================================================

function crearPNGSequence(el) {

  const obj =
    document.createElement("a-image");

  obj.setAttribute(
    "width",
    el.width || 1
  );

  obj.setAttribute(
    "height",
    el.height || 1
  );

  obj.setAttribute(
    "material",
    "transparent: true; alphaTest: 0.01; side: double;"
  );

  const totalFrames =
    el.frames || 1;

  const fps =
    el.fps || 24;

  let currentFrame = 1;

  function getFrame(frame) {

    return `assets/${el.prefix}${String(frame).padStart(4, "0")}.png`;

  }

  // FRAME INICIAL

  obj.setAttribute(
    "src",
    getFrame(1)
  );

  // SOLO CARGA EL FRAME ACTUAL

  const interval =
    1000 / fps;

  let lastTime = 0;

  function animate(time) {

    if (!obj.parentNode) return;

    if (time - lastTime >= interval) {

      currentFrame++;

      if (currentFrame > totalFrames) {
        currentFrame = 1;
      }

      obj.setAttribute(
        "src",
        getFrame(currentFrame)
      );

      lastTime = time;
    }

    sequenceAnimationId =
      requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);

  return obj;
}

    // =====================================================
    // VIDEO
    // =====================================================

    async function crearVideo(el) {

      videoElement =
        document.createElement("video");

      videoElement.id = "mainVideo";

      videoElement.src =
        `assets/${el.asset}`;

      videoElement.loop = true;
      videoElement.muted = true;
      videoElement.playsInline = true;
      videoElement.crossOrigin = "anonymous";

      videoElement.preload = "auto";

      videoElement.setAttribute(
        "playsinline",
        ""
      );

      videoElement.setAttribute(
        "webkit-playsinline",
        "true"
      );

      assets.appendChild(videoElement);

      await new Promise((resolve) => {

        videoElement.addEventListener(
          "loadeddata",
          resolve,
          { once: true }
        );

        videoElement.load();
      });

      const obj =
        document.createElement("a-video");

      obj.setAttribute(
        "src",
        "#mainVideo"
      );

      obj.setAttribute(
        "width",
        el.width || 1
      );

      obj.setAttribute(
        "height",
        el.height || 1
      );

      obj.setAttribute(
        "material",
        "shader: flat; side: double; transparent: true;"
      );

      return obj;
    }

    // =====================================================
    // CARGAR ESCENA
    // =====================================================

    async function cargarEscena() {

      debug.innerText =
        "📦 Cargando escena...";

      const res =
        await fetch("./escena.json");

      const data =
        await res.json();

      root.innerHTML = "";

      for (const el of data.elementos) {

        let obj;

        // =================================================
        // IOS = PNG SEQUENCE
        // =================================================

        if (
          isIOS &&
          el.type === "png_sequence"
        ) {

          console.log(
            "🍎 iOS → PNG Sequence"
          );

          obj =
            crearPNGSequence(el);
        }

        // =================================================
        // ANDROID / PC = VIDEO
        // =================================================

        else {

          console.log(
            "🎬 Android/Desktop → Video"
          );

          obj =
            await crearVideo(el);
        }

        // POSITION

        obj.setAttribute(
          "position",
          `${el.position?.x || 0}
           ${el.position?.y || 0}
           ${el.position?.z || 0.01}`
        );

        // ROTATION

        obj.setAttribute(
          "rotation",
          `${el.rotation?.x || 0}
           ${el.rotation?.y || 0}
           ${el.rotation?.z || 0}`
        );

        // SCALE

        obj.setAttribute(
          "scale",
          `${el.scale?.x || 1}
           ${el.scale?.y || 1}
           ${el.scale?.z || 1}`
        );

        root.appendChild(obj);
      }

      debug.innerText =
        "✅ Escena cargada";
    }

    // =====================================================
    // TARGET EVENTS
    // =====================================================

    function configurarTarget() {

      target.addEventListener(
        "targetFound",
        async () => {

          debug.innerText =
            "✅ Libreta detectada";

          root.setAttribute(
            "visible",
            true
          );

          if (
            videoElement &&
            !isIOS
          ) {

            try {

              videoElement.currentTime = 0;

              await videoElement.play();

            } catch (err) {

              console.warn(err);
            }
          }
        }
      );

      target.addEventListener(
        "targetLost",
        () => {

          debug.innerText =
            "❌ Libreta perdida";

          root.setAttribute(
            "visible",
            false
          );

          if (videoElement) {

            videoElement.pause();

            videoElement.currentTime = 0;
          }
        }
      );
    }

    // =====================================================
    // START
    // =====================================================

    startBtn.addEventListener(
      "click",
      async () => {

        try {

          startBtn.style.display = "none";

          debug.innerText =
            "🚀 Inicializando...";

          // ESPERAR SCENE

          if (!sceneEl.hasLoaded) {

            await new Promise((resolve) => {

              sceneEl.addEventListener(
                "loaded",
                resolve,
                { once: true }
              );

            });
          }

          // CÁMARA

          await iniciarCamara();

          // ESCENA

          await cargarEscena();

          // TARGET

          configurarTarget();

          // MINDAR

          const mindarSystem =
            sceneEl.systems["mindar-image-system"];

          await mindarSystem.start();

          debug.innerText =
            "📷 Escaneando libreta";

        } catch (err) {

          console.error(err);

          debug.innerText =
            `💥 ${err.message}`;

          startBtn.style.display =
            "block";
        }
      }
    );

    // =====================================================
    // CLEANUP
    // =====================================================

    window.addEventListener(
      "beforeunload",
      () => {

        if (mediaStream) {

          mediaStream
            .getTracks()
            .forEach(track => track.stop());
        }

        if (sequenceAnimationId) {

          cancelAnimationFrame(
            sequenceAnimationId
          );
        }
      }
    );

  </script>

</body>

</html>
