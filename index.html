<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AR Libreta</title>

  <!-- AFRAME -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>

  <!-- MINDAR -->
  <script src="./libs/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #videoFeed {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 1;
      display: none;
    }

    a-scene {
      width: 100% !important;
      height: 100% !important;
      display: block !important;
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      z-index: 10 !important;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
      display: block !important;
    }

    #debug {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      color: #00ffcc;
      padding: 10px 18px;
      border-radius: 12px;
      z-index: 10001;
      font-size: 14px;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(0, 255, 204, 0.3);
      pointer-events: none;
      font-weight: bold;
    }

    #msg {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      color: white;
      padding: 12px 20px;
      border-radius: 20px;
      z-index: 10001;
      font-size: 15px;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      pointer-events: none;
    }

    #startBtn {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 18px 28px;
      background: #00ffcc;
      color: black;
      border: none;
      font-size: 18px;
      font-weight: bold;
      border-radius: 14px;
      z-index: 10000;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(0, 255, 204, 0.5);
      transition: all 0.3s ease;
      pointer-events: auto;
    }

    #startBtn:hover {
      background: #00ffdd;
      box-shadow: 0 0 35px rgba(0, 255, 204, 0.7);
    }

    #startBtn:active {
      transform: translate(-50%, -50%) scale(0.95);
    }
  </style>
</head>

<body>

  <!-- VIDEO FEED VISIBLE EN BACKGROUND -->
  <video
    id="videoFeed"
    autoplay
    playsinline
    muted
  ></video>

  <button id="startBtn">
    Iniciar experiencia
  </button>

  <div id="debug">
    Estado: iniciando...
  </div>

  <div id="msg">
    📷 Apunta a la libreta
  </div>

  <!-- ===================================================== -->
  <!-- SCENE -->
  <!-- ===================================================== -->

  <a-scene
    id="scene"
    mindar-image="
      imageTargetSrc: ./assets/libreta.mind;
      autoStart: false;
      uiLoading: yes;
      uiScanning: yes;
      maxTrack: 1;
    "
    color-space="sRGB"
    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      antialias: true;
      logarithmicDepthBuffer: true;
      alpha: true;
      premultipliedAlpha: false;
    "
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
  >

    <!-- ASSETS -->
    <a-assets id="assets" timeout="30000"></a-assets>

    <!-- CAMERA -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
      wasd-controls="enabled: false"
    ></a-camera>

    <!-- TARGET -->
    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0"
    >
      <a-entity
        id="root"
        visible="false"
      ></a-entity>
    </a-entity>

  </a-scene>

  <script>

    const debug = document.getElementById("debug");
    const startBtn = document.getElementById("startBtn");
    const videoFeed = document.getElementById("videoFeed");

    const sceneEl = document.getElementById("scene");
    const assets = document.getElementById("assets");

    const target = document.getElementById("target");
    const root = document.getElementById("root");

    let videoElement = null;
    let isVideoReady = false;
    let mediaStream = null;

    // =====================================================
    // CARGAR ESCENA
    // =====================================================

    async function cargarEscena() {

      try {

        debug.innerText = "📦 Cargando escena...";

        const res = await fetch("./escena.json");

        if (!res.ok) {
          throw new Error("No existe escena.json");
        }

        const data = await res.json();

        root.innerHTML = "";

        for (const el of data.elementos) {

          let obj;

          const isVideo =
            el.asset &&
            /\.(mp4|webm)$/i.test(el.asset);

          // =================================================
          // VIDEO WEBM CON TRANSPARENCIA
          // =================================================

          if (isVideo) {

            videoElement = document.createElement("video");

            videoElement.id = "mainVideo";

            videoElement.src = `assets/${el.asset}`;

            // OPTIMIZACIONES ESPECÍFICAS PARA WEBM CON ALPHA

            videoElement.loop = true;
            videoElement.muted = true;
            videoElement.autoplay = false;
            videoElement.playsInline = true;
            videoElement.crossOrigin = "anonymous";

            // Permitir reproducción en iOS sin sonido
            videoElement.preload = "metadata";
            videoElement.setAttribute("playsinline", "");
            videoElement.setAttribute("webkit-playsinline", "true");

            assets.appendChild(videoElement);

            debug.innerText = "🎬 Cargando video WebM...";

            // ESPERAR CARGA - MÚLTIPLES EVENTOS PARA WEBM

            await new Promise((resolve, reject) => {

              let loadTimeout;

              const clearListeners = () => {
                clearTimeout(loadTimeout);
                videoElement.removeEventListener("loadedmetadata", onLoadedMetadata);
                videoElement.removeEventListener("loadeddata", onLoadedData);
                videoElement.removeEventListener("canplay", onCanPlay);
                videoElement.removeEventListener("error", onError);
              };

              const onLoadedMetadata = () => {
                console.log("✓ loadedmetadata fired");
                clearListeners();
                isVideoReady = true;
                debug.innerText = "✅ Video WebM listo";
                resolve();
              };

              const onLoadedData = () => {
                console.log("✓ loadeddata fired");
                clearListeners();
                isVideoReady = true;
                debug.innerText = "✅ Video WebM listo";
                resolve();
              };

              const onCanPlay = () => {
                console.log("✓ canplay fired");
                clearListeners();
                isVideoReady = true;
                debug.innerText = "✅ Video WebM listo";
                resolve();
              };

              const onError = (e) => {
                console.error("❌ Error en video:", videoElement.error);
                clearListeners();
                reject(new Error(`Error WebM: código ${videoElement.error?.code}`));
              };

              // Timeout más generoso para WebM
              loadTimeout = setTimeout(() => {
                console.warn("⚠ Timeout en carga, continuando de todas formas...");
                clearListeners();
                isVideoReady = true; // Asumir que está listo
                debug.innerText = "⚠ Video (parcialmente cargado)";
                resolve();
              }, 5000);

              // Escuchar múltiples eventos
              videoElement.addEventListener("loadedmetadata", onLoadedMetadata, { once: true });
              videoElement.addEventListener("loadeddata", onLoadedData, { once: true });
              videoElement.addEventListener("canplay", onCanPlay, { once: true });
              videoElement.addEventListener("error", onError, { once: true });

              // Forzar carga
              videoElement.load();

            });

            obj = document.createElement("a-video");

            obj.setAttribute("src", "#mainVideo");
            obj.setAttribute("width", el.width || 3.5);
            obj.setAttribute("height", el.height || 2.5);
            
            // Material con transparencia
            obj.setAttribute(
              "material",
              "shader: flat; side: double; transparent: true; alphaTest: 0.01; opacity: 1.0;"
            );

          }

          // =================================================
          // IMAGEN
          // =================================================

          else {

            const img = document.createElement("img");

            img.id = `imgAsset_${Date.now()}`;

            img.src = `assets/${el.asset}`;

            assets.appendChild(img);

            obj = document.createElement("a-image");

            obj.setAttribute("src", `#${img.id}`);
            obj.setAttribute("width", el.width || 1);
            obj.setAttribute("height", el.height || 1);
          }

          // =================================================
          // TRANSFORM
          // =================================================

          const posX = el.position?.x || 0;
          const posY = el.position?.y || 0;
          const posZ = el.position?.z || 0.01;

          obj.setAttribute("position", `${posX} ${posY} ${posZ}`);

          const rotX = el.rotation?.x || 0;
          const rotY = el.rotation?.y || 0;
          const rotZ = el.rotation?.z || 0;

          obj.setAttribute("rotation", `${rotX} ${rotY} ${rotZ}`);

          const scaleX = el.scale?.x || 1;
          const scaleY = el.scale?.y || 1;
          const scaleZ = el.scale?.z || 1;

          obj.setAttribute("scale", `${scaleX} ${scaleY} ${scaleZ}`);

          // Material transparente para otros elementos
          if (!isVideo) {
            obj.setAttribute("material", "transparent: true; alphaTest: 0.01; side: double;");
          }

          root.appendChild(obj);
        }

        debug.innerText = "✅ Escena cargada";

      } catch (err) {

        console.error(err);

        debug.innerText = `💥 ${err.message}`;
      }
    }

    // =====================================================
    // TARGET EVENTS
    // =====================================================

    function configurarTarget() {

      target.addEventListener(
        "targetFound",
        async () => {

          debug.innerText = "✅ Libreta detectada";

          root.setAttribute("visible", true);

          // REPRODUCIR VIDEO

          if (videoElement && isVideoReady) {

            try {

              videoElement.currentTime = 0;

              const playPromise = videoElement.play();

              if (playPromise !== undefined) {
                playPromise
                  .then(() => {
                    console.log("▶ Video iniciado correctamente");
                    debug.innerText = "▶ Video en reproducción";
                  })
                  .catch((err) => {
                    console.warn("⚠ No se pudo reproducir:", err);
                    debug.innerText = "⚠ Error reproduciendo video";
                  });
              }

            } catch (e) {
              console.error("Error reproduciendo video:", e);
            }
          }
        }
      );

      target.addEventListener(
        "targetLost",
        () => {

          debug.innerText = "❌ Libreta perdida";

          root.setAttribute("visible", false);

          if (videoElement) {
            videoElement.pause();
            videoElement.currentTime = 0;
          }
        }
      );
    }

    // =====================================================
    // SOLICITAR PERMISOS DE CÁMARA Y OBTENER STREAM
    // =====================================================

    async function solicitarPermisosCamara() {
      try {
        debug.innerText = "📷 Solicitando acceso a cámara...";
        
        const constraints = {
          video: {
            width: { ideal: 1280 },
            height: { ideal: 720 },
            facingMode: "environment"
          },
          audio: false
        };

        // Solicitar permisos y obtener stream
        mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
        
        // Asignar stream al video element para mostrarlo
        videoFeed.srcObject = mediaStream;
        videoFeed.style.display = "block";
        
        console.log("✓ Permisos de cámara otorgados y stream visible");
        return true;

      } catch (err) {
        console.error("Error de permisos:", err);
        
        if (err.name === "NotAllowedError") {
          throw new Error("Cámara rechazada por el usuario");
        } else if (err.name === "NotFoundError") {
          throw new Error("No se encontró cámara en el dispositivo");
        } else if (err.name === "NotReadableError") {
          throw new Error("Cámara en uso por otra aplicación");
        } else if (err.name === "OverconstrainedError") {
          throw new Error("Especificaciones de cámara no soportadas");
        } else {
          throw new Error(`Permiso de cámara: ${err.message}`);
        }
      }
    }

    // =====================================================
    // PREVENT BODY SCROLL
    // =====================================================

    document.addEventListener("touchmove", (e) => {
      e.preventDefault();
    }, { passive: false });

    // =====================================================
    // START
    // =====================================================

    startBtn.addEventListener(
      "click",
      async () => {

        try {

          startBtn.style.display = "none";

          debug.innerText = "🚀 Inicializando...";

          // ESPERAR SCENE

          if (!sceneEl.hasLoaded) {

            await new Promise(resolve => {

              sceneEl.addEventListener(
                "loaded",
                resolve,
                { once: true }
              );

            });
          }

          // SOLICITAR PERMISOS DE CÁMARA Y OBTENER STREAM
          
          await solicitarPermisosCamara();

          debug.innerText = "✅ Cámara visible";

          // CARGAR ESCENA

          await cargarEscena();

          // CONFIGURAR TARGET

          configurarTarget();

          // MINDAR

          const mindarSystem =
            sceneEl.systems["mindar-image-system"];

          if (!mindarSystem) {

            throw new Error(
              "MindAR no inicializado"
            );
          }

          debug.innerText = "🎥 Inicializando escaneo...";

          // START CAMERA - CON REINTENTOS

          let intentos = 0;
          const maxIntentos = 3;

          while (intentos < maxIntentos) {
            try {
              await mindarSystem.start();
              console.log("✓ MindAR iniciado");
              break;
            } catch (err) {
              intentos++;
              console.warn(`Intento ${intentos} fallido:`, err);
              
              if (intentos >= maxIntentos) {
                throw new Error(`No se pudo iniciar MindAR (${err.message})`);
              }
              
              // Esperar un poco antes de reintentar
              await new Promise(resolve => setTimeout(resolve, 500));
            }
          }

          debug.innerText = "📷 Escaneando libreta";

        } catch (err) {

          console.error(err);

          debug.innerText = `💥 ${err.message || "Error iniciando"}`;

          startBtn.style.display = "block";
          
          // Detener stream en caso de error
          if (mediaStream) {
            mediaStream.getTracks().forEach(track => track.stop());
            videoFeed.style.display = "none";
          }
        }
      }
    );

    // =====================================================
    // CLEANUP AL SALIR
    // =====================================================

    window.addEventListener("beforeunload", () => {
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
      }
    });

  </script>

</body>

</html>
