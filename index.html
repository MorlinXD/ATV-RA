<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AR Libreta</title>

  <!-- AFRAME -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>

  <!-- MINDAR -->
  <script src="./libs/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
      font-family: Arial, sans-serif;
    }

    #debug {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      color: #00ffcc;
      padding: 10px 18px;
      border-radius: 12px;
      z-index: 999;
      font-size: 14px;
      backdrop-filter: blur(6px);
    }

    #msg {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.65);
      color: white;
      padding: 12px 20px;
      border-radius: 20px;
      z-index: 999;
      font-size: 15px;
      backdrop-filter: blur(6px);
    }

    #startBtn {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 18px 28px;
      background: #00ffcc;
      color: black;
      border: none;
      font-size: 18px;
      font-weight: bold;
      border-radius: 14px;
      z-index: 1000;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(0, 255, 204, 0.5);
    }
  </style>
</head>

<body>

  <button id="startBtn">
    Iniciar experiencia
  </button>

  <div id="debug">
    Estado: iniciando...
  </div>

  <div id="msg">
    📷 Apunta a la libreta
  </div>

  <!-- ===================================================== -->
  <!-- SCENE -->
  <!-- ===================================================== -->

  <a-scene
    id="scene"
    mindar-image="
      imageTargetSrc: ./assets/libreta.mind;
      autoStart: false;
      uiLoading: yes;
      uiScanning: yes;
      maxTrack: 1;
    "
    color-space="sRGB"
    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      antialias: true;
    "
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
  >

    <!-- ASSETS -->
    <a-assets id="assets"></a-assets>

    <!-- CAMERA -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>

    <!-- TARGET -->
    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0"
    >
      <a-entity
        id="root"
        visible="false"
      ></a-entity>
    </a-entity>

  </a-scene>

  <script>

    const debug = document.getElementById("debug");
    const startBtn = document.getElementById("startBtn");

    const sceneEl = document.getElementById("scene");
    const assets = document.getElementById("assets");

    const target = document.getElementById("target");
    const root = document.getElementById("root");

    let videoElement = null;

    // =====================================================
    // CARGAR ESCENA
    // =====================================================

    async function cargarEscena() {

      try {

        debug.innerText = "📦 Cargando escena...";

        const res = await fetch("./escena.json");

        if (!res.ok) {
          throw new Error("No existe escena.json");
        }

        const data = await res.json();

        root.innerHTML = "";

        for (const el of data.elementos) {

          let obj;

          const isVideo =
            el.asset &&
            /\.(mp4|webm)$/i.test(el.asset);

          // =================================================
          // VIDEO
          // =================================================

          if (isVideo) {

            videoElement = document.createElement("video");

            videoElement.id = "mainVideo";

            videoElement.src = `assets/${el.asset}`;

            // OPTIMIZACIONES

            videoElement.loop = true;
            videoElement.muted = true;
            videoElement.autoplay = false;
            videoElement.playsInline = true;
            videoElement.crossOrigin = "anonymous";

            // CARGA RÁPIDA

            videoElement.preload = "auto";

            // iOS

            videoElement.setAttribute("webkit-playsinline", "true");

            assets.appendChild(videoElement);

            // ESPERAR CARGA

            await new Promise((resolve) => {

              videoElement.addEventListener(
                "loadeddata",
                resolve,
                { once: true }
              );

            });

            obj = document.createElement("a-video");

            obj.setAttribute(
              "src",
              "#mainVideo"
            );

            obj.setAttribute(
              "width",
              el.width || 1
            );

            obj.setAttribute(
              "height",
              el.height || 0.6
            );
          }

          // =================================================
          // IMAGEN
          // =================================================

          else {

            const img = document.createElement("img");

            img.id = "imgAsset";

            img.src = `assets/${el.asset}`;

            assets.appendChild(img);

            obj = document.createElement("a-image");

            obj.setAttribute(
              "src",
              "#imgAsset"
            );

            obj.setAttribute(
              "width",
              el.width || 1
            );

            obj.setAttribute(
              "height",
              el.height || 1
            );
          }

          // =================================================
          // TRANSFORM
          // =================================================

          obj.setAttribute(
            "position",
            `${el.position?.x || 0}
             ${el.position?.y || 0}
             ${el.position?.z || 0}`
          );

          obj.setAttribute(
            "rotation",
            `${el.rotation?.x || 0}
             ${el.rotation?.y || 0}
             ${el.rotation?.z || 0}`
          );

          obj.setAttribute(
            "scale",
            `${el.scale?.x || 1}
             ${el.scale?.y || 1}
             ${el.scale?.z || 1}`
          );

          obj.setAttribute(
            "material",
            "transparent: true; alphaTest: 0.01; side: double;"
          );

          root.appendChild(obj);
        }

        debug.innerText = "✅ Escena cargada";

      } catch (err) {

        console.error(err);

        debug.innerText = "💥 Error cargando escena";
      }
    }

    // =====================================================
    // TARGET EVENTS
    // =====================================================

    function configurarTarget() {

      target.addEventListener(
        "targetFound",
        async () => {

          debug.innerText = "✅ Libreta detectada";

          root.setAttribute(
            "visible",
            true
          );

          // REPRODUCIR VIDEO

          if (videoElement) {

            try {

              videoElement.currentTime = 0;

              await videoElement.play();

            } catch (e) {

              console.log(e);
            }
          }
        }
      );

      target.addEventListener(
        "targetLost",
        () => {

          debug.innerText = "❌ Libreta perdida";

          root.setAttribute(
            "visible",
            false
          );

          if (videoElement) {

            videoElement.pause();
          }
        }
      );
    }

    // =====================================================
    // START
    // =====================================================

    startBtn.addEventListener(
      "click",
      async () => {

        try {

          startBtn.style.display = "none";

          debug.innerText = "🚀 Inicializando...";

          // ESPERAR SCENE

          if (!sceneEl.hasLoaded) {

            await new Promise(resolve => {

              sceneEl.addEventListener(
                "loaded",
                resolve,
                { once: true }
              );

            });
          }

          // CARGAR ESCENA

          await cargarEscena();

          // CONFIGURAR TARGET

          configurarTarget();

          // MINDAR

          const mindarSystem =
            sceneEl.systems["mindar-image-system"];

          if (!mindarSystem) {

            throw new Error(
              "MindAR no inicializado"
            );
          }

          // START CAMERA

          await mindarSystem.start();

          debug.innerText =
            "📷 Escaneando libreta";

        } catch (err) {

          console.error(err);

          debug.innerText =
            "💥 Error iniciando";
        }
      }
    );

  </script>

</body>

</html>
